<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Manoir des Marais</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #screen {
    width: min(100vw, calc(100vh * 4 / 3));
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    outline: none;
  }
  #loading {
    position: absolute; color: #a33; font: 16px monospace; letter-spacing: 2px;
  }
</style>
</head>
<body>
<div id="loading">CHARGEMENT…</div>
<canvas id="screen" width="320" height="240" tabindex="0"></canvas>
<script type="module">
  import init from './pkg/psx_resident.js';
  init().then(() => {
    document.getElementById('loading').remove();
    document.getElementById('screen').focus();
  }).catch((e) => {
    document.getElementById('loading').textContent = 'Erreur : ' + e;
  });
</script>
</body>
</html>
