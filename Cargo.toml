[package]
name = "psx-resident"
version = "0.1.0"
edition = "2021"
description = "Survival horror façon PlayStation 1, rendu logiciel, natif + WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "psx-resident"
path = "src/main.rs"

[dependencies]
font8x8 = "0.3"
gilrs = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
softbuffer = "0.4"
cpal = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.17", features = ["wasm-bindgen"] }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
    "CanvasRenderingContext2d", "ImageData", "KeyboardEvent", "MouseEvent",
    "EventTarget", "Event", "Performance", "DomRect", "CssStyleDeclaration", "console", "Storage",
] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
